AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - Cognito user pool: sign-in with email and password (self sign-up, email
  verification code), a public app client for the SPA, a Cognito domain with managed login
  (version 2: one hosted page with the email form and "Continue with Google"), and Google as
  an identity provider that is created only when GoogleClientId is set.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  AppUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173,http://localhost:3000
    Description: >-
      Origins of the frontend (no trailing slash). Cognito sends the browser back to
      <origin>/auth/callback after sign-in and to <origin>/signed-out after sign-out.
      Kept up to date by the infra scripts.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth client id; leave empty to keep Google sign-in disabled.
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]

Resources:
  # Retained on delete and replace: deleting the pool deletes every account in it.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      # Managed login (version 2) needs the Essentials tier; the first 10,000 monthly
      # active users are free.
      UserPoolTier: ESSENTIALS
      # Users sign in with their email; Cognito emails a code to verify it.
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # A new email (profile page) takes effect only after its code is entered; until then
      # the user keeps signing in with, and recovering the password through, the old one.
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      # Mirrored by the signup form (frontend/src/pages/signup-page.tsx).
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Cognito's own sender: no SES setup, limited to about 50 emails a day.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Meetings verification code
        EmailMessage: "Your Meetings verification code is {####}"
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  # Hosted domain for the OAuth endpoints and the managed login page. Prefixes are global.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ${ProjectName}-${AWS::AccountId}
      ManagedLoginVersion: 2

  # Without a branding, a version 2 domain has no sign-in page to show. Cognito's own
  # look is enough: the page lists the email form and "Continue with Google" together.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  # Public client (no secret): a browser cannot keep one. The SPA signs in with the
  # authorization code flow (+ PKCE) through managed login.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${ProjectName}-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      # Referencing the provider (its Ref is "Google") makes the client wait for it.
      SupportedIdentityProviders: !If
        - HasGoogle
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      # aws.cognito.signin.user.admin lets the profile page change the name, email and
      # password of a user who signed in through managed login.
      AllowedOAuthScopes: [openid, email, profile, aws.cognito.signin.user.admin]
      # "<origin>/auth/callback" for every origin: join with the suffix and a comma, then
      # append the suffix once more for the last origin.
      CallbackURLs: !Split
        - ","
        - !Join ["", [!Join ["/auth/callback,", !Ref AppUrls], "/auth/callback"]]
      LogoutURLs: !Split
        - ","
        - !Join ["", [!Join ["/signed-out,", !Ref AppUrls], "/signed-out"]]

Outputs:
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Domain:
    Description: Cognito domain (managed login and OAuth endpoints)
    Value: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  Issuer:
    Description: Issuer of the tokens; the backend checks it
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  GoogleEnabled:
    Value: !If [HasGoogle, "true", "false"]
